lints.workspace = true

[package]
name = "bindgen-tests"
version = "0.1.0"
publish = false
rust-version.workspace = true
edition.workspace = true

[dev-dependencies]
ext-php-rs-bindgen = { workspace = true, default-features = true, features = ["__cli", "experimental"] }
owo-colors.workspace = true
prettyplease = { workspace = true, features = ["verbatim"] }
proc-macro2.workspace = true
regex.workspace = true
shlex.workspace = true
similar = { workspace = true, features = ["inline"] }
syn.workspace = true
tempfile.workspace = true

[features]
logging = ["ext-php-rs-bindgen/logging"]
static = ["ext-php-rs-bindgen/static"]
runtime = ["ext-php-rs-bindgen/runtime"]

__testing_only_extra_assertions = ["ext-php-rs-bindgen/__testing_only_extra_assertions"]
__testing_only_libclang_9 = ["ext-php-rs-bindgen/__testing_only_libclang_9"]
__testing_only_libclang_16 = ["ext-php-rs-bindgen/__testing_only_libclang_16"]
