lints.workspace = true

[package]
name = "bindgen-integration"
description = "A package to test various bindgen features"
version = "0.1.0"
authors = ["Emilio Cobos Álvarez <emilio@crisal.io>"]
publish = false
build = "build.rs"
rust-version.workspace = true
edition.workspace = true

[build-dependencies]
ext-php-rs-bindgen = { workspace = true, default-features = true, features = ["experimental"] }
cc.workspace = true

[features]
static = ["ext-php-rs-bindgen/static"]
runtime = ["ext-php-rs-bindgen/runtime"]

__testing_only_extra_assertions = ["ext-php-rs-bindgen/__testing_only_extra_assertions"]
__testing_only_libclang_9 = ["ext-php-rs-bindgen/__testing_only_libclang_9"]
__testing_only_libclang_16 = ["ext-php-rs-bindgen/__testing_only_libclang_16"]
